name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '请输入版本号，例如: 1.0.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Pack NuGet
        run: dotnet pack WangdefaMemory/WangdefaMemory.csproj -c Release -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push NuGet
        run: dotnet nuget push WangdefaMemory/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}

      - name: Build MCP
        run: dotnet build WangdefaMemory.MCP/WangdefaMemory.MCP.csproj -c Release

      - name: Pack ZIP
        run: |
          mkdir -p release
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.dll release/
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.json release/
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.runtimeconfig.json release/
          cd release && zip -r ../WangdefaMemory.MCP.zip . && cd ..

      - name: Upload ZIP to Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./WangdefaMemory.MCP.zip
          asset_name: WangdefaMemory.MCP.zip
          asset_content_type: application/zip