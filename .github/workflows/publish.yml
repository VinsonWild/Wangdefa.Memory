name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '请输入版本号，例如: 1.0.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ==========================
      # 1. 编译 MCP 引擎
      # ==========================
      - name: Build MCP
        run: dotnet build WangdefaMemory.MCP/WangdefaMemory.MCP.csproj -c Release

      # ==========================
      # 2. 打包引擎 ZIP
      # ==========================
      # This zip is what the DSH plugin downloads on first run, so its layout is
      # a contract: the engine dll must sit at the archive root.
      - name: Pack ZIP
        run: |
          mkdir -p release
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.dll release/
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.json release/
          cp WangdefaMemory.MCP/bin/Release/net10.0/*.runtimeconfig.json release/
          cd release && zip -r ../WangdefaMemory.MCP.zip . && cd ..

      # ==========================
      # 3. 上传 ZIP 到 GitHub Release
      # ==========================
      - name: Upload ZIP to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} WangdefaMemory.MCP.zip --repo ${{ github.repository }}

      # ==========================
      # 4. NuGet 包
      # ==========================
      # Both packages carry their own <Version>, and each is published only when
      # that version is not on nuget.org yet. The version number is therefore the
      # single source of truth: bump it to release, leave it to skip. A release
      # that touches neither package publishes nothing to NuGet, and one that
      # touches only the engine does not drag a new MCP shell along, because
      # NuGet resolves the shell's `>=` dependency to the newest engine anyway.
      - name: Resolve package versions
        id: pkg
        run: |
          read_version() {
            local file="$1"
            local v
            v=$(grep -oP '(?<=<Version>)[^<]+' "$file" | head -1 | tr -d '[:space:]')
            if [ -z "$v" ]; then
              echo "no <Version> found in $file" >&2
              exit 1
            fi
            printf '%s' "$v"
          }

          CORE=$(read_version WangdefaMemory/WangdefaMemory.csproj)
          MCP=$(read_version WangdefaMemory.MCP/WangdefaMemory.MCP.csproj)
          echo "core_version=$CORE" >> $GITHUB_OUTPUT
          echo "mcp_version=$MCP" >> $GITHUB_OUTPUT
          echo "core project version: $CORE"
          echo "mcp  project version: $MCP"

      # A version already on nuget.org cannot be pushed again, so its presence
      # is exactly the "already released" test. An unreachable registry reads as
      # "not published": pushing again fails loudly rather than silently
      # skipping a release.
      - name: Check which packages are already published
        id: check
        run: |
          exists() {
            local id="$1" ver="$2"
            curl -fsSL -o /dev/null "https://api.nuget.org/v3-flatcontainer/${id}/${ver}/${id}.nuspec"
          }

          if exists wangdefa.memory "${{ steps.pkg.outputs.core_version }}"; then
            echo "core_published=true" >> $GITHUB_OUTPUT
            echo "core ${{ steps.pkg.outputs.core_version }} already on nuget.org - skipping"
          else
            echo "core_published=false" >> $GITHUB_OUTPUT
            echo "core ${{ steps.pkg.outputs.core_version }} is new - will publish"
          fi

          if exists wangdefa.memory.mcp "${{ steps.pkg.outputs.mcp_version }}"; then
            echo "mcp_published=true" >> $GITHUB_OUTPUT
            echo "mcp ${{ steps.pkg.outputs.mcp_version }} already on nuget.org - skipping"
          else
            echo "mcp_published=false" >> $GITHUB_OUTPUT
            echo "mcp ${{ steps.pkg.outputs.mcp_version }} is new - will publish"
          fi

      - name: Pack core NuGet
        if: steps.check.outputs.core_published == 'false'
        run: dotnet pack WangdefaMemory/WangdefaMemory.csproj -c Release

      - name: Push core NuGet
        if: steps.check.outputs.core_published == 'false'
        run: dotnet nuget push WangdefaMemory/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}

      # No -p:PackageVersion here on purpose: it is a global MSBuild property, so
      # it would flow into the referenced core project and rewrite the generated
      # dependency to the MCP package's own version. The version comes from
      # <Version> in the MCP csproj, which keeps the dependency's floor at the
      # core package's real version.
      - name: Pack MCP NuGet
        if: steps.check.outputs.mcp_published == 'false'
        run: dotnet pack WangdefaMemory.MCP/WangdefaMemory.MCP.csproj -c Release

      - name: Push MCP NuGet
        if: steps.check.outputs.mcp_published == 'false'
        run: dotnet nuget push WangdefaMemory.MCP/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}

      # ==========================
      # 5. 登记到 MCP Registry
      # ==========================
      # server.json pins the MCP package's own version, so it is rewritten to
      # match what was just published; otherwise the listing would point at a
      # version that does not exist.
      - name: Sync server.json version
        if: steps.check.outputs.mcp_published == 'false'
        run: |
          MCPVER="${{ steps.pkg.outputs.mcp_version }}"
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]+(\")/\1${MCPVER}\2/g" .mcp/server.json
          echo "--- .mcp/server.json ---"
          cat .mcp/server.json

      # The registry only holds metadata; it verifies the listing against the
      # README marker inside the published NuGet package, so we wait for
      # nuget.org to serve that readme before publishing server.json.
      - name: Wait for MCP package to be servable
        if: steps.check.outputs.mcp_published == 'false'
        run: |
          MCPVER="${{ steps.pkg.outputs.mcp_version }}"
          URL="https://api.nuget.org/v3-flatcontainer/wangdefa.memory.mcp/${MCPVER}/readme"
          for i in $(seq 1 30); do
            if curl -fsSL "$URL" -o /dev/null; then
              echo "readme is available"
              exit 0
            fi
            echo "not yet available ($i/30)"
            sleep 10
          done
          echo "timed out waiting for the package readme" >&2
          exit 1

      - name: Publish to MCP Registry
        if: github.event_name == 'release' && steps.check.outputs.mcp_published == 'false'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xf mcp-publisher.tar.gz
          ./mcp-publisher login github --token "${{ secrets.MCP_REGISTRY_TOKEN }}"
          ./mcp-publisher publish .mcp/server.json
