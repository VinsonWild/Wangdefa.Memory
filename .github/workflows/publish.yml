name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack WangdefaMemory/WangdefaMemory.csproj -c Release -p:PackageVersion=${{ github.event.release.tag_name }}

      - name: Push to NuGet
        run: dotnet nuget push WangdefaMemory/bin/Release/*.nupkg --trusted-publishing --source https://api.nuget.org/v3/index.json